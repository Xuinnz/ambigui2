<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" role="img">
<title>CMA-ES training fitness by generation</title>

<style>
