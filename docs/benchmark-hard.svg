<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 208" width="780" height="208" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" role="img">
<title>Hard mode AI, original vs this version</title>

<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; }
  .ink-2 { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s1 { fill: #2a78d6; }
  .s1-line { stroke: #2a78d6; }
  .s2-line { stroke: #eb6834; }
  .before { fill: #898781; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; }
    .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .s1 { fill: #3987e5; }
    .s1-line { stroke: #3987e5; }
    .s2-line { stroke: #d95926; }
    .before { fill: #6e6d68; }
  }
</style>

<rect class="surface" width="780" height="208" rx="8"/>
<text class="ink" x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold">Hard mode AI: original vs this version</text>
<text class="ink-2" x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal">40 games per setting (seeds 1000-1039), each capped at 1000 pieces</text>
<rect class="before" x="20" y="62" width="12" height="12" rx="2"/>
<text class="ink-2" x="38.0" y="72.0" font-size="12" text-anchor="start" font-weight="normal">Original (depth 5, saw a hidden piece)</text>
<rect class="s1" x="335.6" y="62" width="12" height="12" rx="2"/>
<text class="ink-2" x="353.6" y="72.0" font-size="12" text-anchor="start" font-weight="normal">This version (3 pieces + hold)</text>
<text class="ink-2" x="20.0" y="131.0" font-size="12" text-anchor="start" font-weight="normal">Original</text>
<text class="ink-2" x="20.0" y="155.0" font-size="12" text-anchor="start" font-weight="normal">This version</text>
<text class="ink" x="112.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold">Lines cleared per game</text>
<line class="axis" x1="112" x2="112" y1="114" y2="164"/>
<path class="before" d="M112.0,116.0 h62.9 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-62.9 z"/>
<text class="ink" x="184.9" y="131.0" font-size="12" text-anchor="start" font-weight="normal">43.5</text>
<path class="s1" d="M112.0,140.0 h158.0 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-158.0 z"/>
<text class="ink" x="280.0" y="155.0" font-size="12" text-anchor="start" font-weight="normal">105.4</text>
<text class="ink-2" x="112.0" y="184.0" font-size="12" text-anchor="start" font-weight="normal">2.4x (higher is better)</text>
<text class="ink" x="334.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold">Score per game</text>
<line class="axis" x1="334" x2="334" y1="114" y2="164"/>
<path class="before" d="M334.0,116.0 h22.0 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-22.0 z"/>
<text class="ink" x="366.0" y="131.0" font-size="12" text-anchor="start" font-weight="normal">15.5k</text>
<path class="s1" d="M334.0,140.0 h158.0 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-158.0 z"/>
<text class="ink" x="502.0" y="155.0" font-size="12" text-anchor="start" font-weight="normal">96.4k</text>
<text class="ink-2" x="334.0" y="184.0" font-size="12" text-anchor="start" font-weight="normal">6.2x (higher is better)</text>
<text class="ink" x="556.0" y="106.0" font-size="12" text-anchor="start" font-weight="bold">Milliseconds per move</text>
<line class="axis" x1="556" x2="556" y1="114" y2="164"/>
<path class="before" d="M556.0,116.0 h158.0 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-158.0 z"/>
<text class="ink" x="724.0" y="131.0" font-size="12" text-anchor="start" font-weight="normal">21.7</text>
<path class="s1" d="M556.0,140.0 h56.8 a4.0,4.0 0 0 1 4.0,4.0 v14.0 a4.0,4.0 0 0 1 -4.0,4.0 h-56.8 z"/>
<text class="ink" x="622.8" y="155.0" font-size="12" text-anchor="start" font-weight="normal">8.15</text>
<text class="ink-2" x="556.0" y="184.0" font-size="12" text-anchor="start" font-weight="normal">2.7x faster (lower is better)</text>
</svg>
