<text class="ink" x="20.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold">Lines cleared per game, by how far the AI looks ahead</text>
<text class="ink-2" x="20.0" y="50.0" font-size="12" text-anchor="start" font-weight="normal">40 games per setting (seeds 1000-1039), each capped at 1000 pieces. Same trained weights for every row.</text>
