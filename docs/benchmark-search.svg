<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 266" width="780" height="266" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" role="img">
<title>Mean lines cleared per game by search setting</title>

<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; }
  .ink-2 { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s1 { fill: #2a78d6; }
  .s1-line { stroke: #2a78d6; }
  .s2-line { stroke: #eb6834; }
  .before { fill: #898781; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; }
    .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .s1 { fill: #3987e5; }
    .s1-line { stroke: #3987e5; }
    .s2-line { stroke: #d95926; }
    .before { fill: #6e6d68; }
  }
</style>

