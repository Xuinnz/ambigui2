name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # raylib's build script needs the Wayland toolchain even for test-only builds.
      - name: Install raylib system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Check formatting
        run: zig fmt --check build.zig src

      - name: Run tests
        run: zig build test --summary all

      - name: Build all native binaries
        run: zig build
